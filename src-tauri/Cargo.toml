[package]
name = "pc-optimizer"
version = "0.1.0"
description = "PC Optimizer: analisis y limpieza segura de Windows"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "pc_optimizer_lib"
crate-type = ["rlib"]

# Sin tests unitarios en el bin: en release su manifest es `requireAdministrator` y el
# arnes de `cargo test` no podria ejecutarlo sin elevar (error 740). La logica vive en la lib.
[[bin]]
name = "pc-optimizer"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sysinfo = { version = "=0.40.3", default-features = false, features = ["system", "disk", "component"] }
trash = "=5.3.0"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
blake3 = "=1.8.7"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

# Dependencias de runtime fijadas desde C-01 (ver design D-02). Ya tienen consumidor:
# rusqlite, thiserror y serde_json (C-02), windows (C-03), trash (C-09), blake3 (C-11) y sysinfo
# (C-06, monitor en vivo: CPU, memoria y contadores de disco; el tiempo activo del disco va por
# PDH con la feature `Win32_System_Performance` de `windows`). walkdir se quito en el cierre de
# C-07: recorre sobre el puerto `FileSystem`, ver design D-05. El lint no admite excepciones por
# dependencia: lo quita el ultimo consumidor.
[lints.cargo]
unused_dependencies = "allow"
