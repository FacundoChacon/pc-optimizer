[package]
name = "pc-optimizer"
version = "0.1.0"
description = "PC Optimizer: analisis y limpieza segura de Windows"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
name = "pc_optimizer_lib"
crate-type = ["rlib"]

# Sin tests unitarios en el bin: en release su manifest es `requireAdministrator` y el
# arnes de `cargo test` no podria ejecutarlo sin elevar (error 740). La logica vive en la lib.
[[bin]]
name = "pc-optimizer"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
sysinfo = { version = "=0.40.3", default-features = false, features = ["system", "disk", "component"] }
walkdir = "=2.5.0"
trash = "=5.3.0"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
blake3 = "=1.8.7"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tauri = { version = "=2.12.5", features = ["test"] }
tempfile = "=3.27.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

# Dependencias de runtime fijadas desde C-01 (ver design D-02) pero aun sin consumidores.
# Tras C-02 ya se usan rusqlite, thiserror y serde_json. Siguen sin uso: sysinfo (C-06),
# walkdir (C-07), trash (C-09) y blake3 (C-11); windows ya lo usa C-03. El lint no admite
# excepciones por dependencia: lo quita el ultimo consumidor.
[lints.cargo]
unused_dependencies = "allow"
